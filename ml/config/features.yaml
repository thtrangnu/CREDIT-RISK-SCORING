# Monotonic constraints for LightGBM (Block 3).
#
# Convention: +1 = as the feature increases, P(default) must not decrease
#             -1 = as the feature increases, P(default) must not increase
#              0 (default, no declaration needed) = unconstrained
#
# In regulated lending, monotonic constraints are more than a regularization trick. They
# guarantee the model never learns a nonsensical relationship (e.g. higher income scoring
# as higher risk), which has to be defensible for adverse action reason codes.
#
# ONLY constrain features with a solid domain rationale and a direction that is obvious
# under ordinary credit-risk understanding. Do NOT constrain features whose real
# relationship with risk is ambiguous or non-monotonic (e.g. AMT_CREDIT, AMT_ANNUITY: a
# large loan can mean a good customer approved for more, or a customer drowning in debt,
# so there is no trustworthy direction).

monotone_constraints:
  # External credit scores (EXT_SOURCE_*): higher score -> better profile -> lower risk.
  EXT_SOURCE_1: -1
  EXT_SOURCE_2: -1
  EXT_SOURCE_3: -1

  # Demographics / current profile.
  DAYS_BIRTH: 1          # closer to 0 (less negative) = younger -> higher risk (standard industry assumption)
  DAYS_EMPLOYED: 1        # closer to 0 = shorter job tenure -> higher risk
  AMT_INCOME_TOTAL: -1    # higher income -> lower risk
  REGION_RATING_CLIENT: 1          # region rating 1=best, 3=worst (per data dictionary) -> higher = riskier
  REGION_RATING_CLIENT_W_CITY: 1

  # Credit history at other institutions (bureau): more/heavier overdue -> higher risk.
  BUREAU_CREDIT_DAY_OVERDUE_MEAN: 1
  BUREAU_CREDIT_DAY_OVERDUE_MAX: 1
  BUREAU_AMT_CREDIT_SUM_OVERDUE_MEAN: 1
  BUREAU_AMT_CREDIT_SUM_OVERDUE_SUM: 1

  # Past installment behaviour: more lateness/underpayment -> higher risk.
  INSTAL_DAYS_LATE_MEAN: 1
  INSTAL_DAYS_LATE_MAX: 1
  INSTAL_PAYMENT_DIFF_MEAN: 1
  INSTAL_PAYMENT_DIFF_SUM: 1

  # Past POS/cash: higher days past due (DPD) -> higher risk.
  POS_SK_DPD_MEAN: 1
  POS_SK_DPD_MAX: 1
